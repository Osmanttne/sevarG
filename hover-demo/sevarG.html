<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sevarG Chat</title>
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sevarG.css">
</head>

<body>
  <h1>sevarG</h1>
  <p class="subtitle">AI-Powered Accessibility Analysis</p>

  <div id="chat-container"></div>
  <div id="loading">Analyzing image... please wait <span class="spinner"></span></div>

  <label for="file-upload" id="upload-label">Upload Image for Analysis</label>
  <input type="file" id="file-upload" accept="image/*" />

  <script>
    const fileInput = document.getElementById('file-upload');
    const chatContainer = document.getElementById('chat-container');
    const loading = document.getElementById('loading');

    const appendMessage = (text, sender, isHTML = false) => {
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      msg.innerHTML = isHTML ? text : text.replace(/\n/g, '<br>');
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    };

    const formatGeminiResponse = (text) => {
      let html = '<h3> Accessibility Analysis</h3>';
      
      // Detect status and add badge
      const lowerText = text.toLowerCase();
      if (lowerText.includes('fully accessible') || lowerText.includes('good accessibility')) {
        html += '<span class="status-badge status-accessible">✓ Accessible</span>';
      } else if (lowerText.includes('limited accessibility') || lowerText.includes('some features')) {
        html += '<span class="status-badge status-needs-improvement">⚠ Needs Improvement</span>';
      } else if (lowerText.includes('no') || lowerText.includes('not accessible')) {
        html += '<span class="status-badge status-inaccessible">✗ Inaccessible</span>';
      }

      // Split into sections
      const sections = text.split(/\n\n+/);
      
      sections.forEach(section => {
        section = section.trim();
        if (!section) return;

        // Check if it's a heading (usually starts with ** or is all caps)
        if (section.startsWith('**') || section === section.toUpperCase()) {
          const heading = section.replace(/\*\*/g, '').trim();
          html += `<h4>${heading}</h4>`;
        }
        // Check if it's a list
        else if (section.includes('\n* ') || section.includes('\n- ')) {
          const items = section.split('\n').filter(s => s.trim());
          html += '<ul>';
          items.forEach(item => {
            const cleaned = item.replace(/^[*-]\s*/, '').trim();
            if (cleaned) {
              html += `<li>${cleaned}</li>`;
            }
          });
          html += '</ul>';
        }
        // Check if it's a numbered list (1. 2. 3. format)
        else if (/^\d+\.\s/.test(section) || section.split('\n').some(line => /^\d+\.\s/.test(line.trim()))) {
          const items = section.split(/(?=\d+\.\s)/);
          html += '<ol>';
          items.forEach(item => {
            let cleaned = item.replace(/^\d+\.\s*/, '').trim();
            // Process bold/italic in list items
            cleaned = cleaned
              .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
              .replace(/\*([^*]+)\*/g, '<em>$1</em>');
            if (cleaned) {
              html += `<li>${cleaned}</li>`;
            }
          });
          html += '</ol>';
        }
        // Regular paragraph
        else {
          // Bold key terms
          let formatted = section
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/\*([^*]+)\*/g, '<em>$1</em>');
          html += `<p>${formatted}</p>`;
        }
      });

      return html;
    };

    const typeFormattedText = async (html, sender) => {
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      chatContainer.appendChild(msg);
      
      // For formatted content, show it all at once with a nice fade
      msg.style.opacity = '0';
      msg.innerHTML = html;
      
      // Fade in animation
      await new Promise(r => setTimeout(r, 100));
      msg.style.transition = 'opacity 0.5s ease';
      msg.style.opacity = '1';
      
      chatContainer.scrollTop = chatContainer.scrollHeight;
    };

    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      appendMessage(`Uploaded: ${file.name}`, 'user');
      loading.style.display = 'block';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('http://127.0.0.1:8000/gemini', {
          method: 'POST',
          body: formData
        });

        if (!res.ok) {
          const t = await res.text().catch(() => '');
          throw new Error(`Backend ${res.status} ${res.statusText} ${t}`);
        }

        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) {
          const t = await res.text();
          throw new Error(`Expected JSON, got "${ct}". Body: ${t.slice(0, 300)}…`);
        }

        const data = await res.json();
        loading.style.display = 'none';

        if (typeof data.response === 'string' && data.response.trim()) {
          const formattedHTML = formatGeminiResponse(data.response);
          await typeFormattedText(formattedHTML, 'ai');
        } else {
          appendMessage('⚠️ Gemini analysis missing in response.', 'ai');
        }

        // Handle Roboflow if present
        const annotatedUrl =
          data?.roboflow?.roboflow_result?.images?.[0]?.annotated ||
          data?.roboflow?.annotated_url;

        if (annotatedUrl) {
          appendMessage(
            `<h3>🎯 Object Detection Results</h3><img src="${annotatedUrl}" alt="Annotated Image">`,
            'ai',
            true
          );
        }

      } catch (err) {
        loading.style.display = 'none';
        appendMessage(`❌ Error: ${err.message || err}`, 'ai');
      }
    });
  </script>
</body>
</html>
