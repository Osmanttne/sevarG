<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sevarG Chat</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,700&display=swap" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="sevarG.css">
</head>

<body>
  <h1>sevarG</h1>
  <p class="subtitle">Chat with Gemini about accessibility in your image</p>

  <div id="chat-container"></div>
  <div id="loading">Analyzing image... please wait ⚙️</div>

  <label for="file-upload" id="upload-label">📷 Upload Image</label>
  <input type="file" id="file-upload" accept="image/*" />

  <script>
    const fileInput = document.getElementById('file-upload');
    const chatContainer = document.getElementById('chat-container');
    const loading = document.getElementById('loading');

    // Add a message to the chat window
    const appendMessage = (text, sender, isHTML = false) => {
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      msg.innerHTML = isHTML ? text : text.replace(/\n/g, '<br>');
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    };

    // Animate Gemini's response typing
    const typeText = async (text, sender) => {
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      chatContainer.appendChild(msg);
      for (let i = 0; i < text.length; i++) {
        msg.innerHTML += text[i];
        await new Promise(r => setTimeout(r, 25)); // typing speed
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    };

fileInput.addEventListener('change', async (event) => {
  const file = event.target.files[0];
  if (!file) return;

  appendMessage(`🖼️ You uploaded: ${file.name}`, 'user');
  loading.style.display = 'block';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('http://127.0.0.1:8000/gemini', {  // keep host consistent with CORS allowlist
      method: 'POST',
      body: formData
    });

    // If server didn’t reply OK, surface the raw text
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error(`Backend ${res.status} ${res.statusText} ${t}`);
    }

    // Ensure we actually got JSON
    const ct = res.headers.get('content-type') || '';
    if (!ct.includes('application/json')) {
      const t = await res.text();
      throw new Error(`Expected JSON, got "${ct}". Body: ${t.slice(0, 300)}…`);
    }

    const data = await res.json();
    loading.style.display = 'none';

    // ---- display Gemini result (matches your backend) ----
    if (typeof data.response === 'string' && data.response.trim()) {
      await typeText(`💬 ${data.response}`, 'ai');
    } else {
      appendMessage('⚠️ Gemini analysis missing in response.', 'ai');
      appendMessage(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'ai', true); // debug
    }

    // ---- optional: if you later add Roboflow to your backend, support both shapes ----
    const annotatedUrl =
      data?.roboflow?.roboflow_result?.images?.[0]?.annotated ||
      data?.roboflow?.annotated_url; // alternate key if you choose

    if (annotatedUrl) {
      appendMessage(
        `<strong>Roboflow Annotated Result:</strong><br><img src="${annotatedUrl}" alt="Annotated Image">`,
        'ai',
        true
      );
    }

  } catch (err) {
    loading.style.display = 'none';
    appendMessage(`❌ Error: ${err.message || err}`, 'ai');
  }
});
  </script>
</body>
</html>
